<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>IgnisRenderer glTF Viewer</title>
	<style>
		html,
		body {
			width: 100%;
			height: 100%;
			margin: 0;
			background: #101114;
			color: #e8eaed;
			font: 14px/1.4 system-ui, sans-serif;
		}

		#canvas3d {
			display: block;
			width: 100vw;
			height: 100vh;
			touch-action: none;
		}

		#controls {
			position: fixed;
			top: 12px;
			left: 12px;
			width: min(360px, calc(100vw - 48px));
			padding: 12px;
			border: 1px solid #383b42;
			border-radius: 8px;
			background: rgb(20 22 27 / 92%);
			box-shadow: 0 4px 16px rgb(0 0 0 / 30%);
		}

		label,
		input,
		button {
			box-sizing: border-box;
		}

		label {
			display: block;
			margin-top: 8px;
		}

		input[type="url"],
		input[type="file"] {
			width: 100%;
			margin-top: 4px;
		}

		button {
			margin-top: 10px;
			padding: 6px 10px;
			border: 0;
			border-radius: 4px;
			background: #4d7cff;
			color: white;
			cursor: pointer;
		}

		#status {
			min-height: 20px;
			margin: 10px 0 0;
			color: #b8c0cc;
		}

		#stats {
			display: grid;
			grid-template-columns: repeat(2, 1fr);
			gap: 8px;
			margin-top: 10px;
		}

		#stats div {
			padding: 6px 8px;
			border-radius: 4px;
			background: #292c33;
		}

		#stats span {
			display: block;
			color: #8f98a8;
			font-size: 11px;
		}

		#hint {
			margin: 8px 0 0;
			color: #8f98a8;
			font-size: 12px;
		}

	</style>
</head>

<body>
	<canvas id="canvas3d"></canvas>
	<section id="controls">
		<strong>glTF Viewer</strong>
		<form id="url-form">
			<label for="model-url">Model URL</label>
			<input id="model-url" type="url" placeholder="./models/model.glb" />
			<button type="submit">Load URL</button>
		</form>
		<label for="model-file">Local GLB or embedded glTF</label>
		<input id="model-file" type="file" accept=".glb,.gltf,model/gltf-binary,model/gltf+json" />
		<p id="status">Choose a model URL or drop a GLB file onto the canvas.</p>
		<div id="stats" aria-label="Renderer statistics">
			<div><span>Meshes</span><strong id="mesh-count">0</strong></div>
			<div><span>Materials</span><strong id="material-count">0</strong></div>
			<div><span>Triangles</span><strong id="triangle-count">0</strong></div>
			<div><span>FPS</span><strong id="fps">0</strong></div>
		</div>
		<p id="hint">
			Models are centered and normalized on load. Drag to orbit, wheel to zoom.
			Use <code>?backend=webgpu</code>, <code>?backend=webgl</code>, or
			<code>?backend=software</code> to choose a backend.
		</p>
	</section>
	<script type="module" src="./main.ts"></script>
</body>

</html>
