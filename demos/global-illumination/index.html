<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>IgnisRenderer SSGI Demo</title>
	<style>
		html,
		body {
			width: 100%;
			height: 100%;
			margin: 0;
			overflow: hidden;
			background: #101114;
			color: #f4f4f5;
			font: 14px/1.4 system-ui, sans-serif;
		}

		#canvas3d {
			display: block;
			width: 100vw;
			height: 100vh;
			cursor: grab;
			touch-action: none;
		}

		#canvas3d:active {
			cursor: grabbing;
		}

		#status {
			position: fixed;
			bottom: 16px;
			left: 16px;
			margin: 0;
			padding: 12px 14px;
			border-radius: 8px;
			background: rgb(10 11 14 / 85%);
			box-shadow: 0 4px 18px rgb(0 0 0 / 30%);
			color: #b8c7ff;
			pointer-events: none;
		}
	</style>
</head>

<body>
	<canvas id="canvas3d"></canvas>
	<p id="status">Checking WebGPU support…</p>
	<script type="module" src="./main.ts"></script>
</body>

</html>
